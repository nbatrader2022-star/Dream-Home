[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**"]

# Netlify functions redirect for /api/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Netlify functions redirect for /auth/callback
[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/api/auth/callback"
  status = 200
  force = true

[[redirects]]
  from = "/auth/callback/*"
  to = "/.netlify/functions/api/auth/callback/:splat"
  status = 200
  force = true

# Client-side SPA routing fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
